<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure TTS 语音合成</title>
<style>
/* ============================================================
   Azure TTS 语音合成 — 设计系统
   白色/浅色系，Azure 蓝主色，简洁有层次
   ============================================================ */
:root {
    --primary: #0078d4;
    --primary-hover: #106ebe;
    --primary-soft: #e8f1fb;
    --success: #107c10;
    --success-soft: #e6f2e6;
    --warning: #b35c00;
    --warning-soft: #fff3e0;
    --danger: #d13438;
    --danger-soft: #fdecec;
    --gray-50: #f7f9fb;
    --gray-100: #f0f3f6;
    --gray-200: #e2e8ee;
    --gray-300: #c8d2dc;
    --gray-400: #98a6b3;
    --gray-500: #6b7a88;
    --gray-600: #4d5b69;
    --gray-700: #37434f;
    --gray-800: #242e37;
    --gray-900: #161d24;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(22,29,36,.05), 0 1px 6px rgba(22,29,36,.04);
    --shadow-md: 0 2px 4px rgba(22,29,36,.06), 0 4px 16px rgba(22,29,36,.05);
    --font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--gray-100);
    color: var(--gray-800);
    min-height: 100vh;
    line-height: 1.6;
}

/* ── 顶部导航 ── */
.header {
    background: #fff;
    border-bottom: 1px solid var(--gray-200);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
}
.header .logo {
    width: 36px; height: 36px;
    background: var(--primary);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,120,212,.3);
}
.header h1 { font-size: 17px; font-weight: 650; letter-spacing: -.2px; color: var(--gray-900); }
.header .subtitle { font-size: 12px; color: var(--gray-400); }
.header .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }

/* 服务状态徽标 */
.health-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 550;
    padding: 5px 12px;
    border-radius: 99px;
    background: var(--gray-100);
    color: var(--gray-500);
    border: 1px solid var(--gray-200);
}
.health-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray-400); }
.health-badge.online { background: var(--success-soft); color: var(--success); border-color: #cfe6cf; }
.health-badge.online .dot { background: var(--success); }
.health-badge.offline { background: var(--danger-soft); color: var(--danger); border-color: #f2cccc; }
.health-badge.offline .dot { background: var(--danger); }
.health-badge.checking .dot { background: var(--warning); animation: pulse 1s ease-in-out infinite; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ── 主布局 ── */
.main {
    display: grid;
    grid-template-columns: 440px 1fr;
    gap: 20px;
    padding: 20px 28px 40px;
    max-width: 1280px;
    margin: 0 auto;
    align-items: start;
}
@media (max-width: 960px) { .main { grid-template-columns: 1fr; } }

/* ── 卡片 ── */
.card {
    background: #fff;
    border-radius: var(--radius);
    border: 1px solid var(--gray-200);
    box-shadow: var(--shadow);
    padding: 22px;
}
.card + .card { margin-top: 16px; }
.card-title {
    font-size: 14px; font-weight: 650;
    color: var(--gray-900);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gray-100);
    display: flex; align-items: center; gap: 8px;
}
.card-title .icon { font-size: 15px; }
.card-title .hint { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--gray-400); }

/* ── 表单 ── */
.form-group { margin-bottom: 16px; }
.form-group:last-child { margin-bottom: 0; }
.form-group label {
    display: block;
    font-size: 12.5px; font-weight: 600;
    color: var(--gray-600);
    margin-bottom: 6px;
}
.form-group label .required { color: var(--danger); }

textarea, input[type="text"], select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--gray-300);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-family: inherit;
    color: var(--gray-800);
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
}
textarea:focus, input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0,120,212,.12);
}
textarea { resize: vertical; min-height: 130px; line-height: 1.7; }

/* 字数统计 */
.char-count { text-align: right; font-size: 11.5px; color: var(--gray-400); margin-top: 4px; }
.char-count.over { color: var(--danger); }

/* 发音人行 */
.voice-row { display: flex; gap: 8px; }
.voice-row select { flex: 1; }
.voice-row input { width: 132px; flex-shrink: 0; font-size: 12.5px; }

/* 滑块式参数行 */
.param-row { display: flex; gap: 8px; align-items: center; }
.param-row input { flex: 1; }
.param-presets { display: flex; gap: 4px; flex-wrap: wrap; }
.param-presets button {
    font-size: 11.5px;
    padding: 4px 9px;
    border: 1px solid var(--gray-300);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--gray-600);
    transition: all .12s;
    white-space: nowrap;
    font-family: inherit;
}
.param-presets button:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-soft);
}
.param-presets button.active {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-soft);
    font-weight: 600;
}

/* ── 按钮 ── */
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 18px;
    font-size: 13.5px; font-weight: 600;
    border: none; border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
}
.btn-primary {
    background: var(--primary); color: #fff;
    width: 100%;
    box-shadow: 0 1px 3px rgba(0,120,212,.25);
}
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.btn-download {
    background: var(--success); color: #fff;
    text-decoration: none;
    white-space: nowrap;
}
.btn-download:hover { background: #0f6b0f; }

/* ── 错误提示 ── */
.error-msg { color: var(--danger); font-size: 12px; margin-top: 4px; display: none; }
.error-msg.show { display: block; }

/* ── 状态条 ── */
.status-bar {
    display: none;
    align-items: center; gap: 10px;
    padding: 11px 14px;
    background: var(--gray-50);
    border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200);
    margin-top: 14px;
}
.status-bar.visible { display: flex; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.status-dot.pending { background: var(--warning); }
.status-dot.processing { background: var(--primary); animation: pulse 1s ease-in-out infinite; }
.status-dot.completed { background: var(--success); }
.status-dot.failed { background: var(--danger); }
.status-text { font-size: 13px; font-weight: 550; }
.status-text.pending { color: var(--warning); }
.status-text.processing { color: var(--primary); }
.status-text.completed { color: var(--success); }
.status-text.failed { color: var(--danger); }
.status-elapsed { font-size: 11.5px; color: var(--gray-400); margin-left: auto; font-variant-numeric: tabular-nums; }

/* ── 结果区 ── */
.result-panel { display: none; }
.result-panel.visible { display: block; }

/* 历史列表头部 */
.history-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
}
.history-title { font-size: 15px; font-weight: 650; color: var(--gray-800); }
.history-title .hint { font-size: 12px; font-weight: 400; color: var(--gray-400); margin-left: 6px; }
.btn-refresh {
    background: var(--gray-100); color: var(--gray-600);
    border: 1px solid var(--gray-200);
    font-size: 12px; font-weight: 550;
    padding: 5px 12px; border-radius: var(--radius-sm);
    cursor: pointer;
}
.btn-refresh:hover { background: var(--gray-200); }
.btn-refresh.loading { opacity: .6; pointer-events: none; }

/* 历史列表 */
.history-list {
    display: flex; flex-direction: column; gap: 10px;
    max-height: calc(100vh - 190px);
    overflow-y: auto;
    padding-right: 4px;
}
.history-item {
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    background: #fff;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgb(0 0 0 / .03);
}
.history-item.highlight {
    animation: itemHighlight 2.2s ease-out;
}
@keyframes itemHighlight {
    0% { background: #fff7e0; border-color: #ffd666; }
    100% { background: #fff; border-color: var(--gray-200); }
}

/* 列表项：第一行（状态 + 摘要 + 时间） */
.item-top { display: flex; align-items: center; gap: 10px; }
.status-badge {
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 99px;
    flex-shrink: 0; white-space: nowrap;
}
.status-badge.completed { background: var(--success-soft); color: var(--success); }
.status-badge.processing { background: #fff3e0; color: var(--warning); }
.status-badge.pending    { background: var(--gray-100); color: var(--gray-500); }
.status-badge.failed     { background: var(--danger-soft); color: var(--danger); }
.item-text {
    flex: 1; min-width: 0;
    font-size: 13px; font-weight: 550; color: var(--gray-800);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item-time { font-size: 11px; color: var(--gray-400); flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* 列表项：第二行（chips） */
.item-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

/* 列表项：第三行（播放器 + 下载） */
.item-audio {
    display: flex; align-items: center; gap: 12px;
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    flex-wrap: wrap;
}
.item-audio audio { flex: 1; min-width: 200px; height: 34px; }

/* 列表项：折叠详情 */
.item-details { margin-top: 10px; }
.item-details summary {
    cursor: pointer; user-select: none;
    font-size: 12px; font-weight: 550; color: var(--primary);
    padding: 6px 0; list-style: none;
}
.item-details summary::-webkit-details-marker { display: none; }
.item-details summary::before { content: '▸ '; }
.item-details[open] summary::before { content: '▾ '; }
.item-details summary:hover { color: var(--primary-hover); }
.item-details .details-body { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
.details-loading { color: var(--gray-400); font-size: 12px; padding: 12px 0; text-align: center; }
.details-card {
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    background: #fff;
}
.details-card-title {
    font-size: 12.5px; font-weight: 650; color: var(--gray-700);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
}
.details-card-title .hint { font-size: 11px; font-weight: 400; color: var(--gray-400); margin-left: auto; }

.empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 480px;
    color: var(--gray-400);
    text-align: center;
    padding: 40px;
}
.empty-state .icon { font-size: 54px; margin-bottom: 14px; opacity: .45; }
.empty-state p { font-size: 14px; line-height: 1.8; }
.empty-state .kbd {
    display: inline-block;
    font-size: 11px; font-family: var(--font-mono);
    background: var(--gray-100);
    border: 1px solid var(--gray-300);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--gray-600);
    margin: 0 1px;
}

/* 音频区 */
.audio-section {
    display: flex; align-items: center; gap: 14px;
    padding: 14px;
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    flex-wrap: wrap;
}
.audio-section audio { flex: 1; min-width: 220px; }

/* 参数摘要 chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip {
    font-size: 11.5px; font-weight: 550;
    padding: 3px 10px;
    background: var(--primary-soft);
    color: var(--primary);
    border-radius: 99px;
}
.chip.dark { background: var(--gray-100); color: var(--gray-600); }

/* JSON 块 */
.json-block {
    background: var(--gray-900);
    color: #d7e1ea;
    border-radius: var(--radius-sm);
    padding: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.7;
    overflow: auto;
    max-height: 420px;
    white-space: pre-wrap;
    word-break: break-all;
}
.json-key { color: #7fb8e8; }
.json-str { color: #8fd6a0; }
.json-num { color: #e8c86e; }
.json-bool { color: #c3a8f0; }
.json-null { color: #f09a9a; }

/* 时间戳表 */
.timings-scroll {
    max-height: 340px;
    overflow-y: auto;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
}
.timings-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.timings-table th {
    text-align: left; padding: 7px 12px;
    background: var(--gray-50);
    border-bottom: 1px solid var(--gray-200);
    font-weight: 600; color: var(--gray-500);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .4px;
    position: sticky; top: 0;
}
.timings-table td { padding: 6px 12px; border-bottom: 1px solid var(--gray-100); }
.timings-table tr:hover td { background: var(--gray-50); }
.timings-table .word-cell { font-weight: 550; color: var(--gray-900); }
.timings-table .time-cell { font-family: var(--font-mono); color: var(--gray-500); font-size: 11.5px; }
.timings-table .duration-cell { font-family: var(--font-mono); color: var(--primary); font-size: 11.5px; font-weight: 600; }
.no-timings { text-align: center; color: var(--gray-400); padding: 18px; font-size: 12.5px; }

/* 任务详情 */
.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 20px; font-size: 12.5px; }
@media (max-width: 600px) { .meta-grid { grid-template-columns: 1fr; } }
.meta-item {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 0; border-bottom: 1px solid var(--gray-100);
}
.meta-label { color: var(--gray-500); flex-shrink: 0; }
.meta-value { font-weight: 550; color: var(--gray-800); text-align: right; overflow: hidden; text-overflow: ellipsis; }
.meta-value.mono { font-family: var(--font-mono); font-size: 11.5px; }

/* 页脚 */
.footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--gray-400);
    padding: 0 0 28px;
}
</style>
</head>
<body>

<!-- ═══════════ 顶部 ═══════════ -->
<header class="header">
    <div class="logo">🎙️</div>
    <div>
        <h1>Azure TTS 语音合成</h1>
        <div class="subtitle">Azure Speech · 词级时间戳 · 异步任务</div>
    </div>
    <div class="right">
        <span class="health-badge checking" id="healthBadge">
            <span class="dot"></span><span id="healthText">检测中…</span>
        </span>
    </div>
</header>

<!-- ═══════════ 主体 ═══════════ -->
<main class="main">

    <!-- ── 左：输入面板 ── -->
    <aside>
        <div class="card">
            <div class="card-title"><span class="icon">📝</span> 文本输入</div>

            <div class="form-group">
                <textarea id="text" placeholder="请输入要合成的文本内容…（Ctrl+Enter 快速提交）"></textarea>
                <div class="char-count" id="charCount">0 字</div>
                <div class="error-msg" id="textError">请输入文本内容</div>
            </div>

            <div class="form-group">
                <label for="voiceSelect">发音人</label>
                <div class="voice-row">
                    <select id="voiceSelect">
                        <optgroup label="⭐ 推荐">
                            <option value="zh-CN-XiaochenNeural">晓辰 Xiaochen · 女 · 默认</option>
                            <option value="zh-CN-XiaoxiaoNeural">晓晓 Xiaoxiao · 女</option>
                            <option value="zh-CN-YunxiNeural">云希 Yunxi · 男</option>
                            <option value="zh-CN-YunyangNeural">云扬 Yunyang · 男</option>
                        </optgroup>
                        <optgroup label="👩 女声">
                            <option value="zh-CN-XiaohanNeural">晓涵 Xiaohan</option>
                            <option value="zh-CN-XiaomouNeural">晓墨 Xiaomou</option>
                            <option value="zh-CN-XiaoruiNeural">晓睿 Xiaorui</option>
                            <option value="zh-CN-XiaoshuangNeural">晓双 Xiaoshuang</option>
                            <option value="zh-CN-XiaoyanNeural">晓颜 Xiaoyan</option>
                            <option value="zh-CN-XiaoyouNeural">晓悠 Xiaoyou</option>
                            <option value="zh-CN-XiaozhenNeural">晓珍 Xiaozhen</option>
                            <option value="zh-CN-YunxiaNeural">云霞 Yunxia</option>
                        </optgroup>
                        <optgroup label="👨 男声">
                            <option value="zh-CN-YunfengNeural">云枫 Yunfeng</option>
                            <option value="zh-CN-YunhaoNeural">云浩 Yunhao</option>
                            <option value="zh-CN-YunjianNeural">云健 Yunjian</option>
                            <option value="zh-CN-YunyeNeural">云野 Yunye</option>
                            <option value="zh-CN-YunzeNeural">云泽 Yunze</option>
                        </optgroup>
                        <optgroup label="🌐 多语言 / 方言">
                            <option value="zh-CN-XiaochenMultilingualNeural">晓辰多语言 Xiaochen Multilingual</option>
                            <option value="zh-CN-XiaoxiaoDialectsNeural">晓晓方言 Xiaoxiao Dialects</option>
                            <option value="zh-CN-guangxi-YunqiNeural">广西·云奇 Yunqi</option>
                            <option value="zh-CN-henan-YundengNeural">河南·云登 Yundeng</option>
                            <option value="zh-CN-liaoning-YunbiaoNeural">辽宁·云彪 Yunbiao</option>
                            <option value="zh-CN-shaanxi-XiaoniNeural">陕西·小妮 Xiaoni</option>
                            <option value="zh-CN-shandong-YunxiangNeural">山东·云翔 Yunxiang</option>
                            <option value="zh-CN-sichuan-YunxiNeural">四川·云希 Yunxi</option>
                        </optgroup>
                    </select>
                    <input type="text" id="voiceCustom" placeholder="自定义…">
                </div>
            </div>

            <div class="form-group">
                <label for="rate">语速</label>
                <div class="param-row">
                    <input type="text" id="rate" value="+20%" placeholder="如 +20%、-10%">
                    <div class="param-presets">
                        <button data-rate="-30%">-30%</button>
                        <button data-rate="-10%">-10%</button>
                        <button data-rate="+0%">正常</button>
                        <button data-rate="+20%" class="active">+20%</button>
                        <button data-rate="+50%">+50%</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="pitch">音调 <span class="hint">新增 · 支持 ±Hz 微调</span></label>
                <div class="param-row">
                    <input type="text" id="pitch" value="+0Hz" placeholder="如 +0Hz、+30Hz、-30Hz">
                    <div class="param-presets">
                        <button data-pitch="-60Hz">-60Hz</button>
                        <button data-pitch="-30Hz">-30Hz</button>
                        <button data-pitch="+0Hz" class="active">+0Hz</button>
                        <button data-pitch="+30Hz">+30Hz</button>
                        <button data-pitch="+60Hz">+60Hz</button>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary" id="submitBtn">🎤 开始合成</button>

            <div class="status-bar" id="statusBar">
                <div class="status-dot pending" id="statusDot"></div>
                <span class="status-text" id="statusText">排队中</span>
                <span class="status-elapsed" id="statusElapsed"></span>
            </div>
        </div>
    </aside>

    <!-- ── 右：历史结果列表 ── -->
    <section class="result-panel visible" id="resultPanel">
        <div class="history-header">
            <div class="history-title">📋 历史结果 <span class="hint" id="historyCount"></span></div>
            <button class="btn btn-refresh" id="refreshBtn" title="刷新列表">↻ 刷新</button>
        </div>
        <div class="history-list" id="historyList"></div>
        <div class="empty-state" id="emptyState">
            <div class="icon">🎧</div>
            <p>暂无合成记录<br>输入文本，点击「开始合成」<br>或按 <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span><br>历史结果将在此展示</p>
        </div>
    </section>

</main>

<div class="footer">Azure TTS Service · tools.exnihilo.site</div>

<script>
// ── 状态 ────────────────────────────────────────────────────────
let pollTimer = null;
let pollStartTime = null;

const $ = id => document.getElementById(id);
const textInput = $('text');
const voiceSelect = $('voiceSelect');
const voiceCustom = $('voiceCustom');
const rateInput = $('rate');
const pitchInput = $('pitch');
const submitBtn = $('submitBtn');
const textError = $('textError');
const charCount = $('charCount');
const statusBar = $('statusBar');
const statusDot = $('statusDot');
const statusText = $('statusText');
const statusElapsed = $('statusElapsed');
const resultPanel = $('resultPanel');
const emptyState = $('emptyState');

const API_BASE = '/azure_api';

// ── 服务健康检查 ────────────────────────────────────────────────
async function checkHealth() {
    const badge = $('healthBadge');
    const label = $('healthText');
    badge.className = 'health-badge checking';
    label.textContent = '检测中…';
    try {
        const res = await fetch('/health', { cache: 'no-store' });
        if (res.ok) {
            badge.className = 'health-badge online';
            label.textContent = '服务在线';
        } else {
            throw new Error('HTTP ' + res.status);
        }
    } catch (e) {
        badge.className = 'health-badge offline';
        label.textContent = '服务离线';
    }
}

// ── 语音值：优先自定义 ──────────────────────────────────────────
function getVoice() { return voiceCustom.value.trim() || voiceSelect.value; }

// ── 参数预设按钮绑定 ────────────────────────────────────────────
document.querySelectorAll('[data-rate]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-rate]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        rateInput.value = btn.dataset.rate;
    });
});
document.querySelectorAll('[data-pitch]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-pitch]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        pitchInput.value = btn.dataset.pitch;
    });
});
[rateInput, pitchInput].forEach(input => {
    input.addEventListener('input', () => {
        const btns = document.querySelectorAll(input === rateInput ? '[data-rate]' : '[data-pitch]');
        btns.forEach(b => b.classList.toggle('active', b.dataset[input === rateInput ? 'rate' : 'pitch'] === input.value));
    });
});

// ── 字数统计 ────────────────────────────────────────────────────
textInput.addEventListener('input', () => {
    charCount.textContent = textInput.value.length + ' 字';
    charCount.classList.toggle('over', textInput.value.length > 5000);
    textError.classList.remove('show');
});

// ── 校验 ────────────────────────────────────────────────────────
function validate() {
    if (!textInput.value.trim()) {
        textError.classList.add('show');
        textInput.focus();
        return false;
    }
    textError.classList.remove('show');
    return true;
}

function formatElapsed(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + ' 秒';
    return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
}

const STATUS_MAP = {
    pending:    { text: '排队中', cls: 'pending' },
    processing: { text: '合成中', cls: 'processing' },
    completed:  { text: '已完成', cls: 'completed' },
    failed:     { text: '失败',   cls: 'failed' },
};

function setStatusUI(status) {
    const info = STATUS_MAP[status] || { text: status, cls: '' };
    statusDot.className = 'status-dot ' + info.cls;
    statusText.className = 'status-text ' + info.cls;
    statusText.textContent = info.text;
}

// ── JSON 高亮 ───────────────────────────────────────────────────
function syntaxHighlight(json) {
    return JSON.stringify(json, null, 2)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(
            /("(\u[a-fA-F0-9]{4}|\\[^u]|[^"\\])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
            match => {
                let cls = 'json-num';
                if (/^"/.test(match)) cls = /:$/.test(match) ? 'json-key' : 'json-str';
                else if (/true|false/.test(match)) cls = 'json-bool';
                else if (/null/.test(match)) cls = 'json-null';
                return '<span class="' + cls + '">' + match + '</span>';
            }
        );
}

function escHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── 历史结果列表 ────────────────────────────────────────────────
let lastTopTaskId = null;   // 用于检测新任务高亮

function formatTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function loadHistory() {
    const refreshBtn = $('refreshBtn');
    if (refreshBtn) refreshBtn.classList.add('loading');
    fetch(API_BASE + '/tts?limit=50')
        .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .then(tasks => renderHistoryList(tasks))
        .catch(err => console.error('加载历史失败:', err))
        .finally(() => { if (refreshBtn) refreshBtn.classList.remove('loading'); });
}

function renderHistoryList(tasks) {
    const list = $('historyList');
    const count = $('historyCount');
    const empty = $('emptyState');
    if (!list) return;

    if (!tasks || tasks.length === 0) {
        list.innerHTML = '';
        count.textContent = '';
        empty.style.display = '';
        return;
    }

    // 新任务检测：最新一条 task_id 变化 → 高亮
    const newTopId = tasks[0].task_id;
    const isNewTop = lastTopTaskId !== null && newTopId !== lastTopTaskId;
    lastTopTaskId = newTopId;

    count.textContent = `最近 ${tasks.length} 条`;
    empty.style.display = 'none';
    list.innerHTML = tasks.map(t => buildHistoryItem(t, isNewTop)).join('');

    // 若新任务在顶部，滚动到顶部
    if (isNewTop) list.scrollTop = 0;
}

function buildHistoryItem(task, isNewTop) {
    const statusCls = ['pending', 'processing', 'completed', 'failed'].includes(task.status) ? task.status : '';
    // 音频 URL：优先 audio_url；否则用纯 task_id 拼（audio_file 带 .mp3 后缀，后端 /audio/{task_id} 不认，会 404）
    const audioUrl = task.audio_url || (API_BASE + '/tts/audio/' + task.task_id);

    const chips = [
        `<span class="chip">${escHtml(task.voice || '—')}</span>`,
        `<span class="chip dark">语速 ${escHtml(task.rate || '+20%')}</span>`,
    ];
    if (task.pitch) chips.push(`<span class="chip dark">音调 ${escHtml(task.pitch)}</span>`);
    if (task.total_ms != null) chips.push(`<span class="chip dark">${(task.total_ms / 1000).toFixed(1)}s</span>`);
    if (task.word_count != null) chips.push(`<span class="chip dark">${task.word_count} 词</span>`);

    const preview = task.text_preview || task.text?.slice(0, 30) || '';
    const audioBlock = task.status === 'completed'
        ? `<div class="item-audio">
                <audio controls preload="none" src="${escHtml(audioUrl)}"></audio>
                <a class="btn btn-download" href="${escHtml(audioUrl)}" download="${escHtml(task.task_id)}.mp3">⬇ 下载</a>
           </div>`
        : (task.status === 'failed'
            ? `<div class="item-audio" style="color:var(--danger);font-size:12px">⚠ ${escHtml(task.error || '合成失败')}</div>`
            : '');

    return `
        <div class="history-item${isNewTop ? ' highlight' : ''}" data-task-id="${escHtml(task.task_id)}">
            <div class="item-top">
                <span class="status-badge ${statusCls}">${escHtml(STATUS_MAP[task.status]?.text || task.status)}</span>
                <span class="item-text" title="${escHtml(preview)}">${escHtml(preview)}</span>
                <span class="item-time">${formatTime(task.created_at)}</span>
            </div>
            <div class="item-chips">${chips.join('')}</div>
            ${audioBlock}
            <details class="item-details" data-task-id="${escHtml(task.task_id)}">
                <summary>词级时间戳 · 任务详情 · SDK 完整返回</summary>
                <div class="details-body"><div class="details-loading">加载中…</div></div>
            </details>
        </div>`;
}

// ── 详情懒加载：展开时才请求单条完整数据 ────────────────────────
document.addEventListener('toggle', e => {
    const details = e.target;
    if (details.tagName !== 'DETAILS' || !details.open || !details.classList.contains('item-details')) return;
    if (details.dataset.loaded === '1') return;

    const taskId = details.dataset.taskId;
    if (!taskId) return;

    fetch(API_BASE + '/tts/' + taskId)
        .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .then(task => {
            details.dataset.loaded = '1';
            details.querySelector('.details-body').innerHTML = buildDetailCards(task);
        })
        .catch(err => {
            details.querySelector('.details-body').innerHTML =
                `<div class="details-loading">加载失败：${escHtml(err.message)}</div>`;
        });
});

function buildDetailCards(task) {
    let cards = '';

    // 1) 词级时间戳
    if (task.word_timings && task.word_timings.length > 0) {
        const rows = task.word_timings.map((w, i) => `
            <tr>
                <td style="color:var(--gray-400);font-size:11px;width:30px">${i + 1}</td>
                <td class="word-cell">${escHtml(w.text)}</td>
                <td class="time-cell">${w.start_ms}</td>
                <td class="time-cell">${w.end_ms}</td>
                <td class="duration-cell">${w.end_ms - w.start_ms}</td>
            </tr>`).join('');
        cards += `
            <div class="details-card">
                <div class="details-card-title"><span>⏱️</span> 词级时间戳
                    <span class="hint">${task.word_timings.length} 个词</span></div>
                <div class="timings-scroll">
                    <table class="timings-table">
                        <thead><tr><th>#</th><th>文本</th><th>开始</th><th>结束</th><th>持续</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>`;
    } else {
        cards += `
            <div class="details-card">
                <div class="details-card-title"><span>⏱️</span> 词级时间戳</div>
                <div class="no-timings">无词级时间戳数据</div>
            </div>`;
    }

    // 2) 任务详情
    const meta = [
        ['任务 ID', task.task_id],
        ['状态', task.status],
        ['发音人', task.voice],
        ['语速', task.rate],
        ['音调', task.pitch || '+0Hz'],
        ['总时长', task.total_ms != null ? task.total_ms + ' ms' : '—'],
        ['词数', task.word_count != null ? task.word_count : (task.word_timings ? task.word_timings.length : '—')],
        ['创建时间', task.created_at || '—'],
        ['更新时间', task.updated_at || '—'],
        ['模式', task.mode || '—'],
    ].map(([k, v]) => `
        <div class="meta-item">
            <span class="meta-label">${escHtml(k)}</span>
            <span class="meta-value ${k === '任务 ID' ? 'mono' : ''}">${escHtml(v ?? '—')}</span>
        </div>`).join('');
    cards += `
        <div class="details-card">
            <div class="details-card-title"><span>📋</span> 任务详情</div>
            <div class="meta-grid">${meta}</div>
        </div>`;

    // 3) SDK 完整返回
    cards += `
        <div class="details-card">
            <div class="details-card-title"><span>🧾</span> SDK 完整返回</div>
            <div class="json-block">${syntaxHighlight(task)}</div>
        </div>`;

    return cards;
}

// ── 轮询 ────────────────────────────────────────────────────────
function startPolling(taskId) {
    pollStartTime = Date.now();
    statusBar.classList.add('visible');
    setStatusUI('pending');

    function poll() {
        const elapsed = Date.now() - pollStartTime;
        statusElapsed.textContent = formatElapsed(elapsed);

        fetch(API_BASE + '/tts/' + taskId)
            .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
            .then(task => {
                setStatusUI(task.status);
                if (task.status === 'completed' || task.status === 'failed') {
                    clearInterval(pollTimer);
                    pollTimer = null;
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '🎤 开始合成';
                    // 合成结束 → 刷新历史列表（新任务自动置顶高亮）
                    loadHistory();
                    if (task.status === 'failed') {
                        statusText.textContent = '失败：' + (task.error || '未知错误');
                        statusText.className = 'status-text failed';
                    }
                }
            })
            .catch(err => console.error('轮询失败:', err));
    }
    poll();
    pollTimer = setInterval(poll, 1500);
}

// ── 提交 ────────────────────────────────────────────────────────
function submitTask() {
    if (!validate()) return;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '⏳ 提交中…';

    const body = {
        text: textInput.value.trim(),
        voice: getVoice(),
        rate: rateInput.value.trim() || '+20%',
        pitch: pitchInput.value.trim() || '+0Hz',
    };

    fetch(API_BASE + '/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    })
        .then(res => {
            if (!res.ok) return res.json().then(e => { throw new Error(e.detail || 'HTTP ' + res.status); });
            return res.json();
        })
        .then(data => {
            resultPanel.innerHTML = '';
            resultPanel.classList.remove('visible');
            emptyState.style.display = '';
            submitBtn.innerHTML = '⏳ 合成中…';
            startPolling(data.task_id);
        })
        .catch(err => {
            alert('提交失败：' + err.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '🎤 开始合成';
        });
}

submitBtn.addEventListener('click', submitTask);
textInput.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); submitTask(); }
});

// ── 初始化 ──────────────────────────────────────────────────────
checkHealth();
setInterval(checkHealth, 30000);

// 刷新按钮
const refreshBtn = $('refreshBtn');
if (refreshBtn) refreshBtn.addEventListener('click', loadHistory);

// 页面加载时拉取历史结果列表
loadHistory();
</script>
</body>
</html>
